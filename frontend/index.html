<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Management System | Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#eef4ff;}
.navbar{background:#0d3878;color:white;padding:18px 35px;display:flex;justify-content:space-between;align-items:center;}
.container{max-width:1100px;margin:35px auto;background:white;padding:25px;border-radius:10px;
box-shadow:0 5px 16px rgba(0,0,0,0.12);}
.section-title{font-size:20px;color:#0d3878;font-weight:600;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{padding:14px 16px;border-bottom:1px solid #e0e5ff;}
th{background:#0d3878;color:white;}
tr:hover{background:#f1f6ff;}
input{padding:10px;width:240px;margin-right:10px;border:1px solid #96b3e6;border-radius:6px;}
button{padding:10px 18px;background:#0d3878;border:none;color:white;border-radius:6px;font-size:15px;cursor:pointer;}
button:hover{background:#092b66;}
.action-btn{padding:6px 10px;margin-right:6px;border-radius:6px;font-size:13px;border:none;cursor:pointer;}
.edit{background:#ffc107;color:black;}
.delete{background:#dc3545;color:white;}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
background:white;padding:25px 35px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.25);}
.close{cursor:pointer;float:right;color:#444;font-size:20px;margin-top:-10px;}
</style>
</head>
<body>

<div class="navbar">
  <h2>User Management System</h2>
  <span>Flask API • MySQL RDS • AWS EC2 Frontend</span>
</div>

<div class="container">
  <div class="section-title">User Records</div>

  <table id="userTable">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <hr style="margin:35px 0">

  <div class="section-title">Add New User</div>
  <form id="addForm">
    <input type="text" id="addName" placeholder="Enter Name" required>
    <input type="email" id="addEmail" placeholder="Enter Email" required>
    <button type="submit">Add User</button>
  </form>
</div>

<script>
const API = "http://98.83.36.215:5000";
let editId = null;

// Load users
function loadUsers() {
  fetch(`${API}/users`)
    .then(res => res.json())
    .then(data => {
      const tbody = document.querySelector("#userTable tbody");
      tbody.innerHTML = "";
      data.forEach(u => {
        tbody.innerHTML += `
          <tr>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>
              <button class="action-btn edit" onclick="openEdit(${u.id}, '${u.name}', '${u.email}')">Edit</button>
              <button class="action-btn delete" onclick="deleteUser(${u.id})">Delete</button>
            </td>
          </tr>`;
      });
    });
}

// Add user
document.getElementById("addForm").addEventListener("submit", (e) => {
  e.preventDefault();

  fetch(`${API}/users/add`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: document.getElementById("addName").value,
      email: document.getElementById("addEmail").value
    })
  })
  .then(response => response.json())
  .then(() => {
    document.getElementById("addForm").reset();
    loadUsers();
  })
  .catch(err => console.error("Add error:", err));
});
// Delete user
function deleteUser(id) {
  if (!confirm("Are you sure you want to delete this user?")) return;
  fetch(`${API}/users/delete/${id}`, { method: "DELETE" })
    .then(() => loadUsers());
}
loadUsers();
</script>

</body>
</html>
